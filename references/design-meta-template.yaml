generated_at: "{{generated-at}}"
system:
  name: "{{system-name}}"
  slug: "{{system-slug}}"
  summary: "{{system-summary}}"
  primary_mode: "{{primary-mode}}"
  domain: "{{domain}}"
  system_type: "{{system-type}}"

source:
  input_type: "{{input-type}}"
  label: "{{source-label}}"
  canonical_url: "{{source-url}}"
  domain: "{{source-domain}}"
  entity_type: "{{source-entity-type}}"
  primary_surface: "{{primary-surface}}"
  analyzed_surfaces:
    - "{{surface-1}}"
    - "{{surface-2}}"
    - "{{surface-3}}"

capture_context:
  inspected_at: "{{inspected-at}}"
  primary_mode_observed: "{{primary-mode-observed}}"
  evidence:
    - kind: "{{evidence-kind}}"
      location: "{{evidence-location}}"
      notes: "{{evidence-notes}}"
  motion_capture:
    detected: "{{true|false}}"
    load_bearing: "{{true|false}}"
    role: "{{decorative|supportive|load-bearing}}"
    scroll_driver: "{{native|smooth|hijacked/pinned}}"
    libraries:
      - "{{library-name}}"
    patterns:
      - "{{motion-pattern}}"
    narrative_scope: "{{narrative-scope}}"
    evidence:
      - kind: "{{runtime-library|data-attribute|sticky-structure|rendered-behavior|source-code|inference}}"
        location: "{{motion-evidence-location}}"
        notes: "{{motion-evidence-notes}}"
    section_flow:
      - section: "{{section-name}}"
        behavior: "{{section-behavior}}"
  entry_capture:
    detected: "{{true|false}}"
    role: "{{decorative|supportive|load-bearing}}"
    trigger: "{{every-load|session-once|first-visit-only}}"
    patterns:
      - "{{entry-pattern}}"
    evidence:
      - kind: "{{overlay|hero-entrance|runtime-library|rendered-behavior|source-code|inference}}"
        location: "{{entry-evidence-location}}"
        notes: "{{entry-evidence-notes}}"
    sequence_flow:
      - step: "{{entry-step}}"
        behavior: "{{entry-behavior}}"
  cursor_capture:
    detected: "{{true|false}}"
    role: "{{decorative|supportive|load-bearing}}"
    scope: "{{global|section-only|hover-zones}}"
    libraries:
      - "{{cursor-library-name}}"
    modes:
      - "{{cursor-mode}}"
    evidence:
      - kind: "{{runtime-library|data-attribute|cursor-overlay|cursor-style|rendered-behavior|source-code|inference}}"
        location: "{{cursor-evidence-location}}"
        notes: "{{cursor-evidence-notes}}"
    zone_behavior:
      - zone: "{{cursor-zone}}"
        behavior: "{{cursor-zone-behavior}}"
  three_capture:
    detected: "{{true|false}}"
    role: "{{decorative|supportive|load-bearing}}"
    integration: "{{background-field|hero-object|section-scene|full-page-stage}}"
    libraries:
      - "{{three-library-name}}"
    behaviors:
      - "{{three-behavior}}"
    evidence:
      - kind: "{{runtime-library|canvas-wrapper|rendered-behavior|source-code|inference}}"
        location: "{{three-evidence-location}}"
        notes: "{{three-evidence-notes}}"
    scene_flow:
      - zone: "{{three-zone}}"
        behavior: "{{three-zone-behavior}}"
  image_capture:
    detected: "{{true|false}}"
    role: "{{decorative|supportive|load-bearing}}"
    media_types:
      - "{{image-media-type}}"
    recurring_subjects:
      - "{{image-subject}}"
    treatments:
      - "{{image-treatment}}"
    evidence:
      - kind: "{{rendered-image|screenshot|asset-pattern|source-code|inference}}"
        location: "{{image-evidence-location}}"
        notes: "{{image-evidence-notes}}"
    composition_patterns:
      - "{{image-composition-pattern}}"
  component_capture:
    strategy: "visual-first reconciliation"
    sampled_families:
      - family: "{{component-family}}"
        variants:
          - "{{component-variant}}"
        evidence: "{{screenshot|geometry|computed-style|source-token}}"
        confidence: "{{high|medium|low}}"
        notes: "{{component-capture-notes}}"
    known_disagreements:
      - "{{computed-style-disagreed-with-rendered-visual}}"

translation:
  abstraction_goal: "Separate source identity from reusable design language."
  output_style: "Prefer expressive constraints over exhaustive constraints."
  component_output_style: "Components are visual recipes, not raw computed-style audits."
  derivation_summary: "{{derivation-summary}}"
  excluded_source_markers:
    - "Source brand names stay in this file only."
    - "Source URLs stay in this file only."
    - "Source-specific marketing copy is rewritten into generic design language."
  reuse_notes:
    - "{{reuse-note-1}}"
    - "{{reuse-note-2}}"
